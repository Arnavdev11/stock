name: Python tests

# Runs the repository's OFFLINE unit tests on every pull request that targets main, on every push to main, and by hand.
# It only reads the code and runs `python -m unittest`. It starts no updater, calls no data provider, uses no secret, writes no cache, publishes nothing
# and deploys nothing. The tests use synthetic data and need no credentials or network access.
#
# Not part of the ledger/cache group on purpose: it touches no ledger and no saved cache, so it must never wait behind (or delay) a data refresh.

"on":
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  unittest:
    name: unittest
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0              # some guard tests compare workflow files with the commit history
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"      # the version every production workflow uses

      - name: Install the test dependencies
        run: pip install pandas requests pyyaml

      # test_first_500_priority.py arrives with the first-500 change (PR #40); until it is on a branch this step is skipped rather than failing.
      - name: Focused tests (first-500 refresh priority)
        if: hashFiles('test_first_500_priority.py') != ''
        run: python -m unittest test_first_500_priority

      # Each failing or erroring test is also written as an annotation (test id and the last line of its traceback), so a failure can be read from the
      # check run itself (the Checks API) without downloading the log. The exit status is the suite's own.
      - name: Full offline suite
        run: |
          set +e
          python -m unittest discover -p 'test_*.py' > unittest.log 2>&1
          status=$?
          cat unittest.log
          python3 - <<'PY'
          import re
          text = open("unittest.log", encoding="utf-8", errors="replace").read()
          blocks = re.split(r"(?m)^={70}\n", text)
          for b in blocks:
              m = re.match(r"(FAIL|ERROR): (\S+) \(([^)]*)\)", b)
              if not m:
                  continue
              parts = b.split("-" * 70)
              lines = [l for l in (parts[1] if len(parts) > 1 else "").splitlines() if l.strip()]
              last = lines[-1].strip() if lines else ""
              msg = ("%s %s: %s" % (m.group(1), m.group(3), last))[:900].replace("%", "%25").replace("\r", "").replace("\n", " ")
              print("::error title=Failed test::" + msg)
          PY
          exit $status
