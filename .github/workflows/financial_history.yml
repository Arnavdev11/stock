name: Update financial history ledger

# Separate from "Update data and publish site" (which is not changed).
# It restores the same saved-data cache, adds/updates data/financial_history_ledger.json and out/financial_history.json, and saves the cache again.
# The next run of "Update data and publish site" then restores it and publishes out/financial_history.json with the site (it copies out/*.json).
# Run this first, wait for it to finish, then run "Update data and publish site".
# Manual only (workflow_dispatch).

on:
  # TEMPORARY validation trigger - to be removed in a cleanup commit.
  push:
    branches:
      - phase1
  workflow_dispatch:
    inputs:
      symbols:
        description: "Optional comma list for a small first run, e.g. TCS. Empty = all 10 development stocks."
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  group: stocklens-financial-history
  cancel-in-progress: false

jobs:
  history:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install requests

      - name: Restore saved data
        uses: actions/cache@v4
        with:
          path: |
            data
            out
          key: nse-data-fhist-${{ github.run_id }}
          restore-keys: nse-data-

      - name: Update the financial history ledger
        env:
          UPSTOX_ANALYTICS_TOKEN: ${{ secrets.UPSTOX_ANALYTICS_TOKEN }}
          HISTORY_SYMBOLS: ${{ inputs.symbols }}
        run: python financial_history_updater.py

      - name: Validation summary (no financial values)
        if: always()
        run: |
          python - <<'PY'
          import json, os
          p = "out/financial_history.json"
          if not os.path.exists(p):
              print("NO OUTPUT FILE"); raise SystemExit(0)
          d = json.load(open(p))
          print("schema", d.get("schema"), "as_of", d.get("as_of"), "stocks_with_years", len(d["stocks"]), "errors", len(d["errors"]), "warnings", len(d["warnings"]))
          for sym, s in sorted(d["stocks"].items()):
              ys = s["years"]
              bases = sorted({y["basis"] for y in ys})
              fys = sorted({y["fy"] for y in ys})
              rev = [y["fy"] for y in ys if y["values"].get("revenue") is not None]
              fcf = [y["fy"] for y in ys if y["values"].get("free_cash_flow") is not None]
              capex = [y["fy"] for y in ys if y["values"].get("capex") is not None]
              print("OK  %s layout=%s fy_end_month=%s basis=%s records=%d fiscal_years=%s" % (sym, s.get("statement_layout"), s.get("fiscal_year_end_month"), bases, len(ys), fys))
              print("      revenue=%s capex=%s fcf=%s gaps=%s" % ("available %s" % rev if rev else "unavailable", capex or "none", "available %s" % fcf if fcf else "null", s.get("gaps")))
              print("      missing_by_year=%s" % {y["fy"]: y.get("missing") for y in ys})
          for e in d["errors"]:
              print("FAIL", e.get("symbol"), "-", e.get("error"))
          for w in d["warnings"]:
              print("WARN", {k: w[k] for k in w if k not in ("ledger", "financials")})
          PY

      - name: Upload generated ledger
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: financial-history
          path: |
            data/financial_history_ledger.json
            out/financial_history.json
          if-no-files-found: warn
