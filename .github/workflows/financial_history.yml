name: Update financial history ledger

# Separate from "Update data and publish site" (which is not changed).
# It restores the same saved-data cache, adds/updates data/financial_history_ledger.json and out/financial_history.json, and saves the cache again.
# The next run of "Update data and publish site" then restores it and publishes out/financial_history.json with the site (it copies out/*.json).
# Run this first, wait for it to finish, then run "Update data and publish site".
# Manual only (workflow_dispatch).

on:
  workflow_dispatch:
    inputs:
      symbols:
        description: "Optional comma list for a small first run, e.g. TCS. Empty = all 10 development stocks."
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  group: stocklens-financial-history
  cancel-in-progress: false

jobs:
  history:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install requests

      - name: Restore saved data
        uses: actions/cache@v4
        with:
          path: |
            data
            out
          key: nse-data-fhist-${{ github.run_id }}
          restore-keys: nse-data-

      - name: Update the financial history ledger
        env:
          UPSTOX_ANALYTICS_TOKEN: ${{ secrets.UPSTOX_ANALYTICS_TOKEN }}
          HISTORY_SYMBOLS: ${{ inputs.symbols }}
        run: python financial_history_updater.py
