name: Update historical price data

# Separate from "Update data and publish site".
# A cache written by a run on phase1 cannot be read by the publishing run on main, so the files no longer travel through the cache alone:
#   * before the update, the files already saved on the data branch (historical/ on `stocklens-data`) are merged into out/ (never dropping a day);
#   * after a MANUAL run, the updater's files are verified and handed to "Save historical price data" (save_historical.yml), which adds them
#     under historical/ on the data branch only, and only if nothing saved would be lost;
#   * "Update data and publish site" then copies historical/ from the data branch into the site folder.
# A push to phase1 stays a read-only test (TCS only): it saves nothing to the data branch.
# Run this first (manually, from main), wait for it to finish, then run "Update data and publish site".

on:
  push:
    branches:
      - phase1
  workflow_dispatch:
    inputs:
      symbols:
        description: "Comma list of symbols. The first test is TCS only; an empty field also means TCS (it never widens to the configured universe)."
        required: false
        default: "TCS"
      max_calls:
        description: "Upstox call budget for this run (1 s per call). Empty = 150. A NIFTY 500 first fill needs about 3000 calls: run it a few times with 1500."
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  group: stocklens-historical
  cancel-in-progress: false

jobs:
  historical:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Look for the data branch
        id: databranch
        run: |
          rc=0
          git ls-remote --exit-code --heads origin stocklens-data >/dev/null 2>&1 || rc=$?
          case "$rc" in
            0) echo "exists=true" >> "$GITHUB_OUTPUT" ;;
            2) echo "exists=false" >> "$GITHUB_OUTPUT" ;;
            *) echo "::error::Could not check for the stocklens-data branch (git exit $rc). Stopping, so a network problem is never mistaken for a missing branch."; exit 1 ;;
          esac

      - name: Check out the data branch
        if: steps.databranch.outputs.exists == 'true'
        uses: actions/checkout@v4
        with:
          ref: stocklens-data
          path: ledger-branch
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install requests

      - name: Select the coverage universe
        run: |
          # Stage 1 = NIFTY 500, Stage 2 = all NSE EQ: the only difference is which universe.json sits on the data branch (built by the "Build coverage universe" workflow).
          if [ -f ledger-branch/universe.json ]; then
            python universe.py check ledger-branch/universe.json
            echo "STOCKLENS_UNIVERSE_FILE=$GITHUB_WORKSPACE/ledger-branch/universe.json" >> "$GITHUB_ENV"
          else
            echo "No universe.json on the data branch: the 10 development stocks are used."
          fi

      - name: Restore saved data
        uses: actions/cache@v4
        with:
          path: |
            data
            out
          key: nse-data-hist-${{ github.run_id }}
          restore-keys: nse-data-

      - name: Merge the saved history into out/ (no day is ever dropped)
        if: steps.databranch.outputs.exists == 'true'
        run: python historical_handoff.py seed ledger-branch/historical out

      - name: Update historical prices
        env:
          UPSTOX_ANALYTICS_TOKEN: ${{ secrets.UPSTOX_ANALYTICS_TOKEN }}
          HISTORICAL_SYMBOLS: "${{ github.event_name == 'push' && 'TCS' || inputs.symbols || 'TCS' }}"
          HISTORICAL_MAX_CALLS: ${{ inputs.max_calls }}
        run: python historical_updater.py

      # Manual runs only. The files are checked here, before anything is uploaded; the token is not available to these steps.
      - name: Check the result and prepare the hand-over
        if: github.event_name == 'workflow_dispatch'
        run: python historical_handoff.py stage out handoff

      - name: Hand the result to the save job
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: historical-handoff
          path: handoff
          if-no-files-found: error
          retention-days: 14

  # Saves the checked files to the data branch (under historical/ only). Manual runs only; a push to phase1 never writes to the data branch.
  save-historical:
    needs: historical
    if: ${{ github.event_name == 'workflow_dispatch' }}
    permissions:
      contents: write
    uses: ./.github/workflows/save_historical.yml
