name: Update data and publish site

"on":
  schedule:
    - cron: "15 15 * * 1-5"
    # Tuesday to Saturday at 10:00 IST (04:30 UTC): publishes the previous session's candles that "Update historical price data" fetched at 08:00 IST
    # (Upstox serves a day's candle only from about 07:00 IST the next day), so the site is never a session behind during the day.
    - cron: "30 4 * * 2-6"
  workflow_dispatch:
    inputs:
      fundamentals_calls:
        description: "Upstox call budget for fundamentals (about 2 s per call). Empty = 150 (a normal day)."
        required: false
        default: ""
      financials_calls:
        description: "Upstox call budget for financial statements. Empty = 120. A big first fill of the wider universe can use up to about 1500 (50 min)."
        required: false
        default: ""
      quarterly_calls:
        description: "Upstox call budget for quarterly results. Empty = 100. At most 330 (the step has a 15-minute timeout); a larger value is lowered to 330."
        required: false
        default: ""

permissions:
  contents: read
  actions: read                         # only to list the saved caches when no fundamentals state was restored (cache-miss recovery below)

# One shared group for everything that reads or writes the financial-history ledger or the shareholding ledger (see also financial_history.yml and shareholding.yml). Never cancels a run.
concurrency:
  group: stocklens-ledger
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    env:
      RUN_STATUS_DIR: run-status        # each updater writes a small run record here (counts only; run_status.py); never published
    outputs:
      ledger_ready: ${{ steps.ledgerout.outputs.ready }}
      shareholding_ready: ${{ steps.shpout.outputs.ready }}
      data_ok: ${{ steps.datastatus.outputs.data_ok }}
      data_status: ${{ steps.datastatus.outputs.data_status }}

    steps:
      - uses: actions/checkout@v4

      - name: Look for the data branch
        id: databranch
        run: |
          rc=0
          git ls-remote --exit-code --heads origin stocklens-data >/dev/null 2>&1 || rc=$?
          case "$rc" in
            0) echo "exists=true" >> "$GITHUB_OUTPUT" ;;
            2) echo "exists=false" >> "$GITHUB_OUTPUT" ;;
            *) echo "::error::Could not check for the stocklens-data branch (git exit $rc). Stopping, so a network problem is never mistaken for a missing branch."; exit 1 ;;
          esac

      - name: Check out the data branch
        if: steps.databranch.outputs.exists == 'true'
        uses: actions/checkout@v4
        with:
          ref: stocklens-data
          path: ledger-branch
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - run: pip install pandas requests

      - name: Select the coverage universe
        run: |
          # Stage 1 = NIFTY 500, Stage 2 = all NSE EQ: the only difference is which universe.json sits on the data branch (built by the "Build coverage universe" workflow).
          if [ -f ledger-branch/universe.json ]; then
            python universe.py check ledger-branch/universe.json
            echo "STOCKLENS_UNIVERSE_FILE=$GITHUB_WORKSPACE/ledger-branch/universe.json" >> "$GITHUB_ENV"
          else
            echo "No universe.json on the data branch: the 10 development stocks are used."
          fi

      - name: Restore saved data
        id: restore
        uses: actions/cache@v4
        with:
          path: |
            data
            out
          key: nse-data-${{ github.run_id }}
          restore-keys: nse-data-

      # Cache-miss recovery for fundamentals. Without its saved state the fundamentals step would start from nothing and publish only the few stocks one
      # run can fetch. The combined actions/cache step above only has a `cache-hit` output (an empty string for "nothing restored" and "false" for a
      # prefix match look alike), so the cache it resolved to is read with a second, read-only lookup (actions/cache/restore, lookup-only: it downloads
      # nothing and writes nothing; its `cache-matched-key` is the documented output). With no state in the workspace the run is exactly one of:
      #   restored state            -> checked, never touched;
      #   lookup unavailable        -> stop (a missing cache cannot be told apart from a failed restore);
      #   a cache was resolved      -> stop: it was not restored, or it holds no fundamentals state (another workflow's cache can be the newest one);
      #   no cache resolved, but the complete cache list (every cache of this ref AND the default branch, which is what a restore can read, filtered for the
      #     prefix nse-data- here) shows caches, or cannot be
      #     read completely                                          -> stop;
      #   no cache resolved and the complete list is empty (a genuine miss) -> recover from the published site, validated before anything is written.
      # Every stop leaves the site exactly as it is (the deploy job needs this job) and names the condition and a safe remedy. Nothing here deletes a cache.
      - name: Look up which saved cache the restore resolved to (no download)
        id: lookup
        continue-on-error: true
        uses: actions/cache/restore@v4
        with:
          path: |
            data
            out
          key: nse-data-${{ github.run_id }}
          restore-keys: nse-data-
          lookup-only: true

      - name: Check the restored fundamentals state
        id: fstate
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          REF: ${{ github.ref }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch || 'main' }}
          RESTORE_HIT: ${{ steps.restore.outputs.cache-hit }}
          LOOKUP_OUTCOME: ${{ steps.lookup.outcome }}
          LOOKUP_KEY: ${{ steps.lookup.outputs.cache-matched-key }}
        run: |
          if [ -f data/fundamentals_cache.json ]; then
            python fundamentals_updater.py check-state || { echo "::error::The restored fundamentals state cannot be used (see above). A maintainer must decide: re-running restores the same state. Nothing was published and nothing was changed."; exit 1; }
            echo "state=restored" >> "$GITHUB_OUTPUT"; echo "Saved fundamentals state restored."; exit 0
          fi
          stop() { echo "::error::$1"; shift; for l in "$@"; do echo "$l"; done; echo "Nothing was published and nothing was changed."; exit 1; }
          if [ "$LOOKUP_OUTCOME" != "success" ]; then
            stop "The saved caches could not be looked up (lookup step: ${LOOKUP_OUTCOME:-not run}), so a missing fundamentals state cannot be told apart from a failed restore." "Remedy: re-run this workflow once the GitHub cache service responds. No recovery is attempted while this is unknown."
          fi
          if [ -n "$LOOKUP_KEY" ]; then
            if printf '%s\n' "$LOOKUP_KEY" | grep -qE '^nse-data-[0-9]+$'; then
              stop "The restore resolved to the saved cache $LOOKUP_KEY but no fundamentals state is in the workspace." "Either the restore failed (the 'Restore saved data' step then logs a warning and not 'Cache restored from key: $LOOKUP_KEY'; its cache-hit output was '$RESTORE_HIT') or that cache holds no fundamentals state." "Remedy: re-run once if the restore step shows a failure. If it restored cleanly, a maintainer must decide (an approved manual recovery, or removing that cache): re-running cannot help. This workflow never recovers over an existing cache and never deletes one."
            fi
            stop "The newest saved cache this run can see is $LOOKUP_KEY, written by another workflow, and it holds no fundamentals state (it shadows the daily state cache; cache-hit output '$RESTORE_HIT')." "Remedy: a maintainer must decide (remove that cache, or approve a manual recovery). Re-running cannot help. This workflow never deletes a cache."
          fi
          # nothing resolved: confirm with the complete cache list of every scope a restore can read (this ref and the default branch)
          refs="$REF"; [ "refs/heads/$DEFAULT_BRANCH" = "$REF" ] || refs="$REF refs/heads/$DEFAULT_BRANCH"
          found=0
          for ref in $refs; do
            # every cache of the ref is read (no `key` filter: whether that parameter matches an exact key or a prefix is not documented) and filtered here
            list=$(gh api --paginate "repos/$REPO/actions/caches?ref=$ref&per_page=100" --jq '"total=" + (.total_count | tostring), "read=" + (.actions_caches | length | tostring), (.actions_caches[] | select(.key | startswith("nse-data-")) | "key=" + .key)') || stop "The saved caches of $ref could not be listed, so a missing fundamentals state cannot be told apart from a failed restore." "Remedy: re-run this workflow once the GitHub API responds. No recovery is attempted while this is unknown."
            totals=$(printf '%s\n' "$list" | sed -n 's/^total=//p' | sort -u)
            read=$(printf '%s\n' "$list" | sed -n 's/^read=//p' | awk '{ s += $1 } END { print s + 0 }')
            n=$(printf '%s\n' "$list" | grep -c '^key=' || true)
            case "$totals" in ''|*[!0-9]*) stop "The cache list of $ref is unusable (no single total), so it cannot prove that no cache exists." "Remedy: re-run this workflow once the GitHub API responds. No recovery is attempted while this is unknown." ;; esac
            if [ "$read" != "$totals" ]; then stop "The cache list of $ref is incomplete ($read of $totals caches read), so it cannot prove that no cache exists." "Remedy: re-run this workflow once the GitHub API responds. No recovery is attempted while this is unknown."; fi
            found=$((found + n))
          done
          if [ "$found" != "0" ]; then
            stop "$found saved cache(s) with the prefix nse-data- exist (checked: $refs) but the restore resolved none of them and no fundamentals state is in the workspace (cache-hit output '$RESTORE_HIT')." "Remedy: re-run once in case the restore failed. If it repeats, a maintainer must decide (an approved manual recovery, or removing the caches): this workflow never recovers over an existing cache and never deletes one."
          fi
          echo "state=miss" >> "$GITHUB_OUTPUT"
          echo "::warning::No saved cache exists in $refs (a genuine cache miss): the fundamentals state is recovered from the published site."

      - name: Recover the fundamentals state from the published site (cache miss only)
        if: steps.fstate.outputs.state == 'miss'
        env:
          REPO: ${{ github.repository }}
        run: |
          owner="${REPO%%/*}"; name="${REPO#*/}"
          url="https://${owner,,}.github.io/${name}/out/fundamentals.json"
          curl -fsSL --retry 3 --max-time 120 "$url" -o recovery_fundamentals.json || { echo "::error::$url could not be downloaded. Remedy: re-run once the site responds; nothing is recovered from anything else. Nothing was published and nothing was changed."; exit 1; }
          python fundamentals_updater.py seed recovery_fundamentals.json

      - run: python nse_updater.py
        id: nse

      - name: Update fundamentals
        id: fundamentals
        continue-on-error: true
        env:
          UPSTOX_ANALYTICS_TOKEN: ${{ secrets.UPSTOX_ANALYTICS_TOKEN }}
          FUNDAMENTALS_MAX_CALLS: ${{ inputs.fundamentals_calls || '150' }}
        run: python fundamentals_updater.py

      - name: Update financial statements (Upstox)
        id: financials
        continue-on-error: true
        env:
          UPSTOX_ANALYTICS_TOKEN: ${{ secrets.UPSTOX_ANALYTICS_TOKEN }}
          FINANCIALS_MAX_CALLS: ${{ inputs.financials_calls || '120' }}
        run: python financials_updater.py

      - name: Update financial history (Upstox)
        id: financial_history
        continue-on-error: true
        env:
          UPSTOX_ANALYTICS_TOKEN: ${{ secrets.UPSTOX_ANALYTICS_TOKEN }}
          FINANCIAL_HISTORY_LEDGER_DIR: ${{ steps.databranch.outputs.exists == 'true' && 'ledger-branch' || '' }}
          FINANCIAL_HISTORY_LEDGER_OUT: ledger-out/financial_history_ledger.json
        run: python financial_history_updater.py

      - name: Check the ledger output
        id: ledgerout
        run: |
          if [ -s ledger-out/financial_history_ledger.json ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::warning::The financial history updater produced no ledger this run, so nothing will be saved."
          fi

      - name: Hand the updated ledger to the save job
        if: steps.ledgerout.outputs.ready == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: financial-history-ledger
          path: ledger-out/financial_history_ledger.json
          if-no-files-found: error
          retention-days: 14

      # Phase 5H.5. The shareholding updater (the same script as the manual shareholding.yml) reads the durable ledger from the data branch and
      # rewrites out/shareholding.json, which the site-folder step below publishes with the other out/*.json files.
      # It never initialises a ledger (no init flag is passed) and never creates the data branch. If it fails, nothing is saved and the
      # previously published out/shareholding.json (from the saved-data cache) is left as it was.
      - name: Update shareholding pattern (NSE/XBRL)
        id: shareholding
        continue-on-error: true
        env:
          UPSTOX_ANALYTICS_TOKEN: ${{ secrets.UPSTOX_ANALYTICS_TOKEN }}
          SHAREHOLDING_LEDGER_DIR: ${{ steps.databranch.outputs.exists == 'true' && 'ledger-branch' || '' }}
          SHAREHOLDING_LEDGER_OUT: shareholding-ledger-out/shareholding_ledger.json
          SHAREHOLDING_MAX_STOCKS: "60"      # the stalest 60 stocks of the universe per day (a 500-stock universe is covered about every 9 days)
        run: python shareholding_updater.py

      - name: Check the shareholding ledger output
        id: shpout
        run: |
          if [ -s shareholding-ledger-out/shareholding_ledger.json ] && [ -s out/shareholding.json ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::warning::The shareholding updater produced no ledger this run, so nothing will be saved. The last published shareholding.json (if any) is kept."
          fi

      - name: Hand the updated shareholding ledger to the save job
        if: steps.shpout.outputs.ready == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: shareholding-ledger
          path: shareholding-ledger-out/shareholding_ledger.json
          if-no-files-found: error
          retention-days: 14

      # Quarterly results (Upstox quarterly income statement). The updater reads the published stock directory from the data branch (copied to out/ for it), asks Upstox for the stalest
      # stocks within the call budget, keeps its cache in data/quarterly_cache.json and writes out/by_symbol/quarterly_results/<SYMBOL>.json plus out/quarterly_results.json. Both folders are
      # in the saved-data cache and are published by the Build site folder step below (cp -r out/by_symbol). If it fails, nothing changes: the last published shards stay as they were.
      - name: Update quarterly results (Upstox)
        id: quarterly
        continue-on-error: true
        timeout-minutes: 15
        env:
          UPSTOX_ANALYTICS_TOKEN: ${{ secrets.UPSTOX_ANALYTICS_TOKEN }}
          QUARTERLY_MAX_CALLS: "100"
          QUARTERLY_MAX_CALLS_OVERRIDE: ${{ inputs.quarterly_calls }}      # empty unless set by hand; the updater caps it at 330 (the step's 15-minute timeout)
        run: |
          cp ledger-branch/stock_directory.json out/stock_directory.json
          python quarterly_results_updater.py

      # continue-on-error keeps a quarterly-results problem from blocking the rest of the daily build, so a failure is reported here instead of being silent. The updater writes a shard only after
      # it passes its own checks, and never from a failed call, so a failed run leaves the previously published shards exactly as they were (older, never altered or invented).
      - name: Report a quarterly results failure
        if: steps.quarterly.outcome == 'failure'
        run: echo "::warning::The quarterly results update failed or timed out. The quarterly results published on the site are from the last successful run."

      - name: Validate outputs
        id: validate
        continue-on-error: true
        run: python validate_outputs.py

      # Market activity (52-week lows, most active). Reads only the saved NSE files, downloads nothing, uses no credential.
      # If either command fails, the four derived files are removed (so nothing old or unchecked is published) and the step fails; the site still publishes
      # (the page shows "not available" for those blocks).
      - name: Derive and validate market activity data
        id: market
        continue-on-error: true
        run: |
          if python market_data_updater.py && python validate_market_outputs.py; then
            echo "Market activity data derived and validated."
          else
            rm -f out/market_breadth.json out/market_movers.json out/market_activity.json out/market_dma.json
            echo "::error::Market activity data failed; the derived files were removed and will not be published."
            exit 1
          fi

      - name: Build site folder
        env:
          SENSEX_PUBLIC_DISPLAY_APPROVED: "false"
        run: |
          mkdir _site
          cp index.html _site/
          mkdir _site/out
          cp out/*.json _site/out/
          # the searchable stock directory (built by stock_directory.py, kept on the data branch). Optional and separate from universe.json, which only the research updaters read.
          if [ -f ledger-branch/stock_directory.json ]; then cp ledger-branch/stock_directory.json _site/out/stock_directory.json; fi
          if [ -d out/by_symbol ]; then cp -r out/by_symbol _site/out/by_symbol; fi
          # the saved daily prices (written to the data branch by "Save historical price data"); they replace any copy that came from the saved-data cache
          if [ -f ledger-branch/historical/historical.json ]; then cp ledger-branch/historical/historical.json _site/out/historical.json; fi
          if ls ledger-branch/historical/shards/*.json >/dev/null 2>&1; then mkdir -p _site/out/by_symbol/historical; cp ledger-branch/historical/shards/*.json _site/out/by_symbol/historical/; fi
          cp company_profiles.json _site/out/
          # index_history.json (Upstox index candles) is not published until its redistribution rights are approved.
          rm -f _site/out/index_history.json
          # market_breadth.json, market_movers.json and market_dma.json are not published until their publication has been approved. Only market_activity.json (validated above) is.
          rm -f _site/out/market_breadth.json _site/out/market_movers.json _site/out/market_dma.json
          # SENSEX end-of-day file: never published unless SENSEX_PUBLIC_DISPLAY_APPROVED is exactly "true" (sensex_publish.py). Runs after every copy above.
          python sensex_publish.py guard --site _site

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      # continue-on-error hides a failed data step from the job's own result. This table (run summary) and the "data-status" job below report it.
      - name: Report the data steps
        id: datastatus
        if: always()
        env:
          OUTCOME_NSE: ${{ steps.nse.outcome }}
          OUTCOME_FUNDAMENTALS: ${{ steps.fundamentals.outcome }}
          OUTCOME_FINANCIALS: ${{ steps.financials.outcome }}
          OUTCOME_FINANCIAL_HISTORY: ${{ steps.financial_history.outcome }}
          OUTCOME_SHAREHOLDING: ${{ steps.shareholding.outcome }}
          OUTCOME_QUARTERLY: ${{ steps.quarterly.outcome }}
          OUTCOME_VALIDATE: ${{ steps.validate.outcome }}
          OUTCOME_MARKET: ${{ steps.market.outcome }}
        run: python report_run_status.py

  # Fails the run (after the site was published) when a data step failed, so continue-on-error cannot make a failed update look successful.
  data-status:
    needs: build
    if: ${{ always() && needs.build.result != 'cancelled' }}
    runs-on: ubuntu-latest
    steps:
      - name: Check the data steps
        run: |
          echo "Data steps: ${{ needs.build.outputs.data_status || 'unknown' }}"
          if [ "${{ needs.build.outputs.data_ok }}" != "true" ]; then
            echo "::error::A data step failed (see the Data steps table in the build job's summary). The site was published with the previous data for that step."
            exit 1
          fi
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  save-history:
    needs: build
    if: ${{ needs.build.outputs.ledger_ready == 'true' }}
    permissions:
      contents: write
    uses: ./.github/workflows/save_ledger.yml
    with:
      create_branch: false

  # Phase 5H.5. Saves the shareholding ledger to the data branch with the existing no-loss check (shareholding_ledger.py verify), and nothing else.
  # It waits for save-history so the two jobs never push to the data branch at the same time. It never creates the branch and never initialises the ledger.
  save-shareholding:
    needs: [build, save-history]
    if: ${{ !cancelled() && needs.build.outputs.shareholding_ready == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out the code (for the verification script)
        uses: actions/checkout@v4

      - name: Download the updated shareholding ledger
        uses: actions/download-artifact@v4
        with:
          name: shareholding-ledger
          path: ledger-new

      - name: Check out the data branch
        uses: actions/checkout@v4
        with:
          ref: stocklens-data
          path: ledger-branch

      - name: Verify nothing was lost
        run: python shareholding_ledger.py verify ledger-branch/shareholding_ledger.json ledger-new/shareholding_ledger.json

      - name: Commit the shareholding ledger to the data branch
        run: |
          cd ledger-branch
          cp ../ledger-new/shareholding_ledger.json shareholding_ledger.json
          git add shareholding_ledger.json
          if git diff --cached --quiet; then
            echo "The shareholding ledger did not change. Nothing to commit."
            exit 0
          fi
          if [ "$(git diff --cached --name-only)" != "shareholding_ledger.json" ]; then
            echo "::error::The commit must contain exactly shareholding_ledger.json."
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Update shareholding ledger (run ${{ github.run_id }})"
          git push origin HEAD:stocklens-data
