name: Update data and publish site

"on":
  schedule:
    - cron: "15 15 * * 1-5"
  workflow_dispatch: {}

permissions:
  contents: read
  

jobs:
  build:
    runs-on: ubuntu-latest
    

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - run: pip install pandas requests

      - name: Restore saved data
        uses: actions/cache@v4
        with:
          path: |
            data
            out
          key: nse-data-${{ github.run_id }}
          restore-keys: nse-data-

      - run: python nse_updater.py

      - name: Update fundamentals
        continue-on-error: true
        env:
          UPSTOX_ANALYTICS_TOKEN: ${{ secrets.UPSTOX_ANALYTICS_TOKEN }}
        run: python fundamentals_updater.py

      - name: Update financial statements (Upstox)
        continue-on-error: true
        env:
          UPSTOX_ANALYTICS_TOKEN: ${{ secrets.UPSTOX_ANALYTICS_TOKEN }}
        run: python financials_updater.py

      - name: Validate outputs
        continue-on-error: true
        run: python validate_outputs.py

      - name: Build site folder
        run: |
          mkdir _site
          cp index.html _site/
          mkdir _site/out
          cp out/*.json _site/out/
       - name: Save Phase 1 test output
        uses: actions/upload-artifact@v4
        with:
          name: phase1-test-output
          path: |
            out/
            _site/

     
