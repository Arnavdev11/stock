name: probe-5h6-inv
on:
  push:
    branches: [probe-5h6-inv]
permissions:
  contents: read
jobs:
  inv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          ref: stocklens-data
          path: ledger-branch
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests
      - name: RELIANCE
        continue-on-error: true
        env:
          SYM: RELIANCE
        run: python probe_inv.py
      - name: TCS
        continue-on-error: true
        env:
          SYM: TCS
        run: python probe_inv.py
      - name: INFY
        continue-on-error: true
        env:
          SYM: INFY
        run: python probe_inv.py
      - name: HDFCBANK
        continue-on-error: true
        env:
          SYM: HDFCBANK
        run: python probe_inv.py
      - name: ICICIBANK
        continue-on-error: true
        env:
          SYM: ICICIBANK
        run: python probe_inv.py
      - name: SBIN
        continue-on-error: true
        env:
          SYM: SBIN
        run: python probe_inv.py
      - name: ITC
        continue-on-error: true
        env:
          SYM: ITC
        run: python probe_inv.py
      - name: BHARTIARTL
        continue-on-error: true
        env:
          SYM: BHARTIARTL
        run: python probe_inv.py
      - name: LT
        continue-on-error: true
        env:
          SYM: LT
        run: python probe_inv.py
      - name: MARUTI
        continue-on-error: true
        env:
          SYM: MARUTI
        run: python probe_inv.py
