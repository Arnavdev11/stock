name: Validate cache coverage

# A ONE-OFF, manual (workflow_dispatch only) check of `coverage_report.py --state-dir` against the REAL saved updater state. See CACHE_VALIDATION.md.
#
# WHAT IT DOES
#   1. Reads the metadata of the daily workflow ("Update data and publish site", update.yml) and lists the repository's cache METADATA (no content).
#   2. Picks the newest cache of the default branch that was saved by a SUCCESSFUL run of that exact daily workflow (cache_validation.py select). GitHub's cache list does
#      not record which run made a cache, and fundamentals_batch.yml names its caches the same way (nse-data-<run id>), so the key is never trusted alone: the run with that
#      id is fetched and must be a completed, successful run of the daily workflow (by workflow id and path) on the default branch, and the cache must have been created
#      during that run and be at most 7 days old. A cache whose run is positively a fundamentals-batch run is skipped; anything else that does not check out fails the run.
#   3. Restores THAT KEY ONLY (no restore-keys, fail-on-cache-miss) with the same path set as the daily run (data, out), because the cache version is derived from the paths.
#   4. Refuses unless fundamentals_cache.json, financials_cache.json and quarterly_cache.json are all there.
#   5. Runs the merged coverage report offline against the data branch's universe and `--state-dir data`. Its output stays on the runner.
#   6. Writes ONLY the job summary, built new from an explicit allowlist (cache_validation.py summarize): counts, reason counts, file status, hashes, provenance.
#
# WHAT IT NEVER DOES
#   * It saves no cache, uploads no artifact, deploys nothing, touches no GitHub Pages and writes nothing to any branch.
#   * It calls no provider and uses no secret: the only token is the workflow's own read-only one, to list cache metadata.
#   * It prints no cache content, record, identifier, symbol or path. A refusal prints a fixed code.
#
# THE RESULT IS CACHE COVERAGE, NOT PUBLICATION STATUS. Creating this workflow validates nothing; a successful RUN of it is what would.
#
# GitHub runs a workflow_dispatch workflow only when the file is on the default branch, so this file must be merged before it can be started.
# It shares the stocklens-ledger group with every workflow that writes the saved caches, so it never overlaps one, and it never cancels one.

"on":
  workflow_dispatch:

permissions:
  contents: read
  actions: read            # only to list cache metadata

concurrency:
  group: stocklens-ledger
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Require the default branch
        env:
          REF: ${{ github.ref }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          if [ -z "$DEFAULT_BRANCH" ] || [ "$REF" != "refs/heads/$DEFAULT_BRANCH" ]; then
            echo "::error::This check runs on the default branch only, because the cache it reads belongs to that branch."; exit 1
          fi

      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Check out the data branch (the universe)
        uses: actions/checkout@v4
        with:
          ref: stocklens-data
          path: ledger-branch
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Read the daily workflow's metadata
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          gh api "repos/$REPO/actions/workflows/update.yml" > "$RUNNER_TEMP/workflow.json" 2>/dev/null \
            || { echo "::error::The daily workflow's metadata could not be read, so its caches cannot be identified. Nothing was restored."; exit 1; }

      - name: List cache metadata (no content)
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          gh api --paginate "repos/$REPO/actions/caches?ref=refs/heads/$DEFAULT_BRANCH&per_page=100" > "$RUNNER_TEMP/caches.json" 2>/dev/null \
            || { echo "::error::The cache list could not be read, so no cache can be identified. Nothing was restored."; exit 1; }

      - name: Name the runs behind the newest exact-key caches
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: python cache_validation.py candidates "$RUNNER_TEMP/caches.json" "refs/heads/$DEFAULT_BRANCH" "$RUNNER_TEMP/candidate_runs.txt"

      - name: Read those runs' metadata
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          mkdir -p "$RUNNER_TEMP/runs"
          while IFS= read -r id; do
            case "$id" in ''|*[!0-9]*) echo "::error::Unexpected run id."; exit 1 ;; esac
            gh api "repos/$REPO/actions/runs/$id" > "$RUNNER_TEMP/runs/$id.json" 2>/dev/null || rm -f "$RUNNER_TEMP/runs/$id.json"
          done < "$RUNNER_TEMP/candidate_runs.txt"

      - name: Select the newest cache saved by a successful daily run
        id: select
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: python cache_validation.py select "$RUNNER_TEMP/caches.json" "$RUNNER_TEMP/workflow.json" "$RUNNER_TEMP/runs" "refs/heads/$DEFAULT_BRANCH" "$(date -u +%Y-%m-%dT%H:%M:%SZ)"

      - name: Restore that cache only (never saved)
        id: restore
        uses: actions/cache/restore@v4
        with:
          path: |
            data
            out
          key: ${{ steps.select.outputs.key }}
          fail-on-cache-miss: true

      - name: Check that exactly the selected cache was restored
        env:
          WANTED: ${{ steps.select.outputs.key }}
          MATCHED: ${{ steps.restore.outputs.cache-matched-key }}
          HIT: ${{ steps.restore.outputs.cache-hit }}
        run: |
          if [ "$HIT" != "true" ] || [ -z "$WANTED" ] || [ "$MATCHED" != "$WANTED" ]; then
            echo "::error::The restore did not resolve to exactly the selected cache."; exit 1
          fi

      - name: Check the three state files
        run: python cache_validation.py check-files data

      - name: Coverage report (offline, output stays on the runner)
        run: |
          day="$(date -u +%F)"
          echo "CV_AS_OF=$day" >> "$GITHUB_ENV"          # one date for the report and the summary, even across midnight UTC
          python coverage_report.py --data-branch ledger-branch --as-of "$day" --out "$RUNNER_TEMP/report" --state-dir data --scope both > /dev/null 2>&1 \
            || { echo "::error::The coverage report was refused or failed (details withheld)."; exit 1; }

      - name: Job summary (allowlisted aggregate only)
        env:
          CV_MATCHED_KEY: ${{ steps.select.outputs.key }}
          CV_RESTORE_HIT: ${{ steps.restore.outputs.cache-hit }}
          CV_CREATED_AT: ${{ steps.select.outputs.created_at }}
          CV_LAST_ACCESSED_AT: ${{ steps.select.outputs.last_accessed_at }}
          CV_SIZE: ${{ steps.select.outputs.size_in_bytes }}
          CV_VERSION: ${{ steps.select.outputs.version }}
          CV_CACHE_REF: ${{ steps.select.outputs.ref }}
          CV_SOURCE_RUN_ID: ${{ steps.select.outputs.run_id }}
          CV_SOURCE_RUN_EVENT: ${{ steps.select.outputs.run_event }}
          CV_SOURCE_RUN_HEAD_SHA: ${{ steps.select.outputs.run_head_sha }}
          CV_SOURCE_RUN_ATTEMPT: ${{ steps.select.outputs.run_attempt }}
          CV_SOURCE_RUN_CREATED_AT: ${{ steps.select.outputs.run_created_at }}
          CV_SOURCE_RUN_UPDATED_AT: ${{ steps.select.outputs.run_updated_at }}
          CV_SKIPPED_BATCH_CACHES: ${{ steps.select.outputs.skipped_batch_caches }}
          CV_RUN_ID: ${{ github.run_id }}
          CV_MAIN_SHA: ${{ github.sha }}
        run: |
          export CV_DATA_BRANCH_SHA="$(git -C ledger-branch rev-parse HEAD)"
          python cache_validation.py summarize "$RUNNER_TEMP/report/coverage_report.json" data "$GITHUB_STEP_SUMMARY"
