name: Backfill - plan or verify the next run (read-only)

# READ-ONLY helper for the bounded, resumable backfill. It fetches NO data, uses NO secret, writes NOTHING to any branch or cache, publishes nothing and
# DISPATCHES NOTHING. It only runs backfill_controller.py on a checkout of the data branch and uploads a small report.
#   mode = next    : which existing workflow to run next, with which inputs and which cohort (up to 500 stocks), or why there is nothing to do.
#                    The report records the exact stocklens-data commit SHA it looked at: write it down BEFORE starting the production run.
#   mode = verify  : compares the data branch before (the SHA you wrote down) and after a run, checks EVERY saved stock for lost data, classifies the cohort,
#                    FAILS when saved data was lost, and reports the next cohort or the stopping reason.
# The fetching stays in the existing workflows (historical.yml, financial_history.yml), started by a person, each with its own pacing, retries, call budget,
# timeout and concurrency group. A cohort of 500 is a selection of stocks, not 500 requests at once. See BACKFILL.md for the exact manual cycle.
#
# Manual start only: this file has NO schedule, no push trigger and no way to start another workflow. A scheduled continuation is deliberately NOT configured;
# adding one needs a separate, explicit approval.
# Pause: set the repository variable BACKFILL_PAUSED to true; every plan then reports "paused" and plans nothing. Set it to anything else (or delete it) to resume.
# Only the datasets whose progress is saved on the data branch are offered. Fundamentals, quarterly results and annual financials keep their only state in the
# evictable Actions cache, so they are not offered.
#
# Input handling: every value reaches the shell only through an environment variable, is checked by the controller (which refuses with a message that names the
# problem and never echoes the text), and is passed to it as one quoted argument. Nothing is built by string concatenation.

"on":
  workflow_dispatch:
    inputs:
      mode:
        description: "next = plan the next run; verify = check a finished run"
        type: choice
        options:
          - next
          - verify
        default: next
      dataset:
        description: "Dataset to plan or verify"
        type: choice
        options:
          - historical_candles
          - financial_history
        default: historical_candles
      batch_size:
        description: "Cohort size, 1-500 (a selection of stocks, not simultaneous requests)"
        required: false
        default: "500"
      max_calls:
        description: "Provider call budget to plan for. Empty = the updater's own default (candles 150, financial history 120). Refused above the ceiling (candles 3000, financial history 1500). Never raised automatically."
        required: false
        default: ""
      priority_symbols:
        description: "Optional comma list of UPPER-CASE symbols to plan first (for example a reviewed NIFTY 500 list). Every symbol must be in the universe; a bad entry refuses the whole plan."
        required: false
        default: ""
      before_ref:
        description: "verify only: the 40-character stocklens-data commit SHA you recorded before the run (it must be on stocklens-data)"
        required: false
        default: ""
      cohort:
        description: "verify only: the comma list of symbols the run was given (copy it from the next report)"
        required: false
        default: ""
      calls_used:
        description: "verify only, optional: calls the run used (from its own status summary)"
        required: false
        default: ""

permissions:
  contents: read

# Never overlaps another run of this helper; it writes nothing, so it also never waits on or blocks the data refreshes (their own groups guard the real writes).
concurrency:
  group: stocklens-backfill-plan
  cancel-in-progress: false

jobs:
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout the code
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Check out the data branch (full history, to prove the before SHA belongs to it)
        uses: actions/checkout@v4
        with:
          ref: stocklens-data
          path: ledger-branch
          fetch-depth: 0
          persist-credentials: false

      - name: Record the data-branch SHA and check the inputs that need git
        id: shas
        env:
          MODE: ${{ inputs.mode }}
          BEFORE: ${{ inputs.before_ref }}
        run: |
          after="$(git -C ledger-branch rev-parse HEAD)"
          echo "after=$after" >> "$GITHUB_OUTPUT"
          echo "stocklens-data is at $after"
          if [ "$MODE" = "verify" ]; then
            [[ "$BEFORE" =~ ^[0-9a-f]{40}$ ]] || { echo "::error::before_ref must be the 40-character lowercase SHA recorded before the run"; exit 1; }
            git -C ledger-branch cat-file -e "$BEFORE^{commit}" 2>/dev/null || { echo "::error::before_ref is not a commit of stocklens-data"; exit 1; }
            git -C ledger-branch merge-base --is-ancestor "$BEFORE" "$after" || { echo "::error::before_ref is not an ancestor of the current stocklens-data: refusing to compare unrelated snapshots"; exit 1; }
          fi

      - name: Check out the data branch as it was before the run
        if: inputs.mode == 'verify'
        env:
          BEFORE_SHA: ${{ inputs.before_ref }}
        run: git -C ledger-branch worktree add --detach "$GITHUB_WORKSPACE/before-branch" "$BEFORE_SHA"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install the libraries the readers import
        run: pip install pandas requests pyyaml

      - name: Plan the next run or verify the finished one
        env:
          MODE: ${{ inputs.mode }}
          DATASET: ${{ inputs.dataset }}
          BATCH: ${{ inputs.batch_size }}
          CALLS: ${{ inputs.max_calls }}
          PRIORITY: ${{ inputs.priority_symbols }}
          COHORT: ${{ inputs.cohort }}
          USED: ${{ inputs.calls_used }}
          BEFORE_SHA: ${{ inputs.before_ref }}
          AFTER_SHA: ${{ steps.shas.outputs.after }}
          BACKFILL_PAUSED: ${{ vars.BACKFILL_PAUSED }}
        run: |
          set -euo pipefail
          AS_OF="$(TZ=Asia/Kolkata date +%F)"
          mkdir -p report
          if [ "$MODE" = "next" ]; then
            cmd=(python backfill_controller.py next --data-branch ledger-branch --dataset "$DATASET" --as-of "$AS_OF" --batch-size "$BATCH" --out report --data-sha "$AFTER_SHA")
            if [ -n "$PRIORITY" ]; then cmd+=(--priority-symbols "$PRIORITY"); fi
            if [ -n "$CALLS" ]; then cmd+=(--max-calls "$CALLS"); fi
          else
            cmd=(python backfill_controller.py verify --before before-branch --after ledger-branch --dataset "$DATASET" --cohort "$COHORT" --as-of "$AS_OF" --out report --before-sha "$BEFORE_SHA" --after-sha "$AFTER_SHA")
            if [ -n "$USED" ]; then cmd+=(--calls-used "$USED"); fi
          fi
          "${cmd[@]}" | tee report/stdout.txt

      - name: Show the report in the run summary
        if: always()
        run: |
          if ls report/backfill_*.md >/dev/null 2>&1; then cat report/backfill_*.md >> "$GITHUB_STEP_SUMMARY"; fi

      - name: Keep the report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backfill-report-${{ inputs.mode }}-${{ inputs.dataset }}
          path: report
          if-no-files-found: ignore
          retention-days: 14
